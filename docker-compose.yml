services:
  backend:
    build:
      context: ./backend
    container_name: cyberguard-backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-cyberguard-docker-dev-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      DATABASE_URL: sqlite:////data/cyberguard.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - cyberguard-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        # Browser calls API on host machine port 8000
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: cyberguard-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cyberguard-data:
